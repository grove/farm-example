name: Prepare native permission probe (one-time)
on:
  push:
    branches: [ci/prepare-permission-probe]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/gh-aw/actions/setup-cli@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          version: v1.2.2
      - name: Compile isolated diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile --validate --strict
          git diff --exit-code -- .github/aw/actions-lock.json .github/workflows/farm-onboard.lock.yml .github/workflows/farm-hunter.lock.yml .github/workflows/farm-gardener.lock.yml
          lock=.github/workflows/farm-permission-probe.lock.yml
          test -s "$lock"
          for rule in 'node --version' 'npm test' 'node --test test/ledger.test.js'; do
            grep -F "# --allow-tool shell($rule)" "$lock"
          done
          if grep -Eq '# --allow-tool shell\((node|npm)(:\*)?\)$|# --allow-tool shell\(node -p|create_report_incomplete_issue|name: Log detection run|GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"' "$lock"; then exit 1; fi
          grep -F 'GH_AW_MAX_AI_CREDITS: "40"' "$lock" >/dev/null
          grep -F 'GH_AW_MAX_AI_CREDITS="20"' "$lock" >/dev/null
          for p in .github/workflows/farm-permission-probe.md "$lock"; do
            printf 'FARM_HASH %s %s\n' "$p" "$(git hash-object "$p")"
            base64 -w 2048 "$p" | sed "s|^|FARM_DATA $p |"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: permission-probe
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .github/workflows/farm-permission-probe.md
            .github/workflows/farm-permission-probe.lock.yml
