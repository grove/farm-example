name: Prepare corrected Farm reports (one-time)
on:
  push:
    branches: [ci/prepare-report-delivery]
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/gh-aw/actions/setup-cli@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          version: v1.2.2
      - name: Upgrade and compile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh aw add grove/farm@ad61c992a644c631784dbffe017c1b2722f79926 --force --no-security-scanner
          for role in onboard hunter gardener; do
            file=".github/workflows/farm-$role.md"
            grep -q '^timeout-minutes: 30$' "$file"
            grep -q '^  threat-detection:$' "$file"
            sed -i '/^timeout-minutes: 30$/a max-ai-credits: 100\nmax-daily-ai-credits: 100' "$file"
            sed -i '/^  threat-detection:$/a\    max-ai-credits: 50' "$file"
          done
          gh aw compile --validate --strict
          for role in onboard hunter gardener; do
            file=".github/workflows/farm-$role.md"
            lock=".github/workflows/farm-$role.lock.yml"
            if [ "$role" = onboard ]; then record=farm-onboarding.md; else record=farm-investigation.md; fi
            grep -F "allowed-paths: [\"$record\"]" "$file"
            grep -F '\"allowed-paths\":[\"'"$record"'\"]' "$lock" >/dev/null
            grep -Fx 'max-ai-credits: 100' "$file"
            grep -Fx 'max-daily-ai-credits: 100' "$file"
            grep -Fx '    max-ai-credits: 50' "$file"
            grep -Fx '    continue-on-error: false' "$file"
            grep -F 'GH_AW_MAX_AI_CREDITS: "100"' "$lock" >/dev/null
            grep -F 'GH_AW_MAX_AI_CREDITS="50"' "$lock" >/dev/null
            if grep -Eq 'farm-output/|GH_AW_REPORT_INCOMPLETE_CREATE_ISSUE: "true"|GH_AW_REPORT_FAILED_JOBS: "true"|GH_AW_FAILURE_REPORT_AS_ISSUE: "true"|GH_AW_NOOP_REPORT_AS_ISSUE: "true"|create_report_incomplete_issue|name: Log detection run|GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"' "$lock"; then exit 1; fi
          done
          git status --short
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: corrected-farm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .github/aw/
            .github/workflows/farm-*.md
            .github/workflows/farm-*.lock.yml
            .github/skills/
            .gitattributes
            .vscode/
  transfer:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        group: [onboard, hunter, gardener, other]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: corrected-farm
          digest-mismatch: error
          path: ${{ runner.temp }}/farm
      - shell: bash
        working-directory: ${{ runner.temp }}/farm
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          while IFS= read -r p; do
            case "$p" in
              ./.github/workflows/farm-*) [[ "$p" == *"farm-$GROUP."* ]] || continue ;;
              *) [[ "$GROUP" == other ]] || continue ;;
            esac
            case "$p" in
              ./.github/workflows/farm-*.md|./.github/workflows/farm-*.lock.yml|./.github/aw/*|./.github/skills/*|./.gitattributes|./.vscode/settings.json) ;;
              *) exit 1 ;;
            esac
            printf 'FARM_HASH %s %s\n' "$p" "$(git hash-object "$p")"
            base64 -w 2048 "$p" | sed "s|^|FARM_DATA $p |"
          done < <(find . -type f | sort)
