name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test

  qualify-farm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/gh-aw/actions/setup-cli@399a445fe2d8926c616b54b1b82a16b5b2be4445 # v1.2.2
        with:
          version: v1.2.2
      - name: Validate installed workflows and detect generated lock drift
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh aw version
          gh aw compile --validate --strict
          for role in onboard hunter gardener; do
            test -s ".github/workflows/farm-$role.md"
            test -s ".github/workflows/farm-$role.lock.yml"
          done
          git diff --exit-code -- .github/aw/actions-lock.json .github/workflows
          printf 'All installed Farm workflows compile without lock drift. No agents dispatched.\n'
