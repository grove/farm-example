name: Transfer verified Farm installation (one-time)

on:
  push:
    branches: [ci/transfer-farm-installation]
    paths: ['.github/workflows/transfer-farm-installation.yml']

permissions:
  actions: read
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - name: Download exact reviewed compiler output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          repository: grove/farm-example
          run-id: '45486331830'
          artifact-ids: '14963992505'
          digest-mismatch: error
          path: ${{ runner.temp }}/farm-installation
      - name: Verify and transfer only reviewed files
        shell: bash
        working-directory: ${{ runner.temp }}/farm-installation
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          sha256sum -c <<'CHECKSUMS'
          6deb2aacc2637feabf90d248f10f595e95642e5be8fbc2c39d1ee646326d26a4  .github/aw/farm/investigation.md
          dfd6919c7df6ffe30765b3e67c71653ea872b1423e63336aa7fa4d63a871544c  .github/aw/farm/project.example.md
          5b1413c22f5042b971c3a2931090062691abc9b2c9a63977d986a85de1ee30b9  .github/aw/actions-lock.json
          a9cea21ed66000017d1a7ab61618a1f04a5344c5c214e017ac1f84fc6bded627  .github/aw/packages/grove-farm-73aaa49babdc.json
          713d25d329d8fe76a153787b1f5b8085cc27520139fe811dc832690361f88a17  .github/workflows/farm-gardener.lock.yml
          419715a65e948b662bf5004c045b465d6167ad7db0c777e20e94f51f87fc1dc8  .github/workflows/farm-gardener.md
          55a885e53b0a4122b58ffb6f35c3a006c512b32126f9be334649e4278f710987  .github/workflows/farm-hunter.lock.yml
          dc09acc8ca615ec4d9ed96baeb9245af92bc2b288131c534570451b0f74f3c55  .github/workflows/farm-hunter.md
          715ad62b8d4a4f42078cd24d46ecc2f3cfa8ff6cea9c9bbfe229a95e8dde289a  .github/workflows/farm-onboard.lock.yml
          8d96a0aa5f7b635ea7ad88e47fda9124580c1213394cb01a0912f0d46f04ece3  .github/workflows/farm-onboard.md
          aba1cdea3f68ede6ba9a666352c49ed7696b90d1b307afefd7216275dd88ff33  .github/skills/agentic-workflows/SKILL.md
          a8301f0868de1d8d71c787b2b9c458c2834e3b008ba845c4f2db341b965e69e0  .gitattributes
          45db8801178cb3b9e8413cdf5f0b2c8af4c684a2c73b5a2c4d81cad60b675849  .vscode/settings.json
          CHECKSUMS
          # Output base64 only for allowlisted public, checksum-verified files.
          # Do not execute any artifact content or write to the repository.
          case "$GROUP" in
            0)
              base64 -w 3072 '.github/aw/farm/investigation.md' | sed 's/^/FARM_BLOB 0 /'
              base64 -w 3072 '.github/aw/farm/project.example.md' | sed 's/^/FARM_BLOB 1 /'
              base64 -w 3072 '.github/aw/actions-lock.json' | sed 's/^/FARM_BLOB 2 /'
              base64 -w 3072 '.github/aw/packages/grove-farm-73aaa49babdc.json' | sed 's/^/FARM_BLOB 3 /'
              base64 -w 3072 '.github/workflows/farm-gardener.md' | sed 's/^/FARM_BLOB 5 /'
              base64 -w 3072 '.github/workflows/farm-hunter.md' | sed 's/^/FARM_BLOB 7 /'
              base64 -w 3072 '.github/workflows/farm-onboard.md' | sed 's/^/FARM_BLOB 9 /'
              base64 -w 3072 '.github/skills/agentic-workflows/SKILL.md' | sed 's/^/FARM_BLOB 10 /'
              base64 -w 3072 '.gitattributes' | sed 's/^/FARM_BLOB 11 /'
              base64 -w 3072 '.vscode/settings.json' | sed 's/^/FARM_BLOB 12 /'
              ;;
            1)
              base64 -w 3072 '.github/workflows/farm-gardener.lock.yml' | sed 's/^/FARM_BLOB 4 /'
              ;;
            2)
              base64 -w 3072 '.github/workflows/farm-hunter.lock.yml' | sed 's/^/FARM_BLOB 6 /'
              ;;
            3)
              base64 -w 3072 '.github/workflows/farm-onboard.lock.yml' | sed 's/^/FARM_BLOB 8 /'
              ;;
          esac
